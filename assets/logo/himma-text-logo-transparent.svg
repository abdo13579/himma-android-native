<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@800;900&amp;family=Inter:wght@600;700&amp;display=swap');
      .ar-title {
        font-family: 'Cairo', 'Tajawal', 'Almarai', system-ui, -apple-system, sans-serif;
        font-weight: 900;
        font-size: 140px;
        fill: #ffffff;
        text-anchor: middle;
      }
      .en-sub {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-weight: 700;
        font-size: 32px;
        fill: #22c55e;
        letter-spacing: 16px;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Accent Line / Green athletic dash -->
  <rect x="340" y="112" width="110" height="8" rx="4" fill="#22c55e" transform="rotate(-6 395 116)"/>

  <!-- Arabic Wordmark -->
  <text x="400" y="245" class="ar-title">هِمّة</text>

  <!-- English Subtitle -->
  <text x="408" y="325" class="en-sub">HIMMA</text>
</svg>
